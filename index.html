<style>
/* Layout: 青い人工芝のピッチとスコアボード。上部タブ＋1画面ツール（iPad 横向き優先、縦・スマホでは1列） */
:root {
  --bg: #eef2f6;          /* ピッチ外の明るいグレー（青寄り） */
  --surface: #ffffff;
  --surface-2: #e3e9f0;
  --line: #c9d3de;
  --fg: #142233;
  --muted: #5a6b7e;
  --turf: #1b5aa6;        /* 青い人工芝 */
  --turf-strong: #12457f;
  --on-turf: #ffffff;
  --mark: #f2c230;        /* ピッチラインの黄色 */
  --opp: #d0612a;         /* 相手チーム */
  --good: #23824f;
  --bad: #c33b3b;
  --shadow: 0 1px 2px rgba(20, 34, 51, .08), 0 4px 14px rgba(20, 34, 51, .06);
  --font-ui: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", sans-serif;
  --font-num: "Barlow Condensed", "DIN Condensed", "Arial Narrow", var(--font-ui);
  --r: 10px;
  --tap: 46px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1520; --surface: #152131; --surface-2: #1d2c40; --line: #2c3e55; --fg: #e5edf6;
    --muted: #93a5ba; --turf: #3b82d6; --turf-strong: #2a6cbb; --on-turf: #ffffff; --mark: #f2c94c;
    --opp: #e7854f; --good: #4cb37b; --bad: #e46565; --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1520; --surface: #152131; --surface-2: #1d2c40; --line: #2c3e55; --fg: #e5edf6;
  --muted: #93a5ba; --turf: #3b82d6; --turf-strong: #2a6cbb; --on-turf: #ffffff; --mark: #f2c94c;
  --opp: #e7854f; --good: #4cb37b; --bad: #e46565; --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 15px; line-height: 1.5;
  -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--turf-strong); }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.25; }
h2 { font-size: 1.25rem; }
h3 { font-size: 1rem; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: .01em; }

/* ---- 上部バー */
.appbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--turf-strong); color: var(--on-turf);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.appbar-in { display: flex; align-items: center; gap: 18px; min-height: 52px; flex-wrap: wrap; }
.brand { font-family: var(--font-num); font-weight: 700; font-size: 1.35rem; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
.brand b { color: var(--mark); }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
.tabs a { color: var(--on-turf); opacity: .78; text-decoration: none; padding: 14px 12px 12px; border-bottom: 3px solid transparent; white-space: nowrap; font-weight: 600; font-size: .95rem; }
.tabs a.on { opacity: 1; border-bottom-color: var(--mark); }
.tabs a:focus-visible { outline: 2px solid var(--mark); outline-offset: -2px; }

main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 40px; max-width: 1400px; margin: 0 auto; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.spread { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.label { font-size: .75rem; font-weight: 700; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }

/* ---- ボタン・入力 */
.btn { min-height: var(--tap); padding: 0 16px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--turf); border-color: var(--turf); color: var(--on-turf); }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.btn.ghost { background: transparent; }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: .88rem; }
.btn:focus-visible, .chip:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid color-mix(in srgb, var(--turf) 55%, transparent); outline-offset: 1px; }
.btn[disabled] { opacity: .45; pointer-events: none; }
label.field { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; color: var(--muted); font-weight: 600; min-width: 0; }
input[type=text], input[type=date], input[type=time], input[type=number], select, textarea { min-height: var(--tap); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; background: var(--surface); color: var(--fg); font-weight: 400; width: 100%; font-size: 16px; }
textarea { min-height: 110px; font-family: var(--font-ui); }
.check { display: inline-flex; align-items: center; gap: 8px; min-height: var(--tap); cursor: pointer; }
.check input { width: 22px; height: 22px; accent-color: var(--turf); }
.grid-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }

/* ---- セグメント・チップ */
.seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 3px; flex-wrap: wrap; }
.seg button { min-height: 40px; padding: 0 14px; border: 0; background: transparent; border-radius: 8px; font-weight: 700; cursor: pointer; touch-action: manipulation; }
.seg button.on { background: var(--surface); box-shadow: var(--shadow); color: var(--turf); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; touch-action: manipulation; }
.chip.on { background: var(--turf); border-color: var(--turf); color: var(--on-turf); }

/* ---- 表 */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
th { background: var(--surface-2); font-size: .78rem; color: var(--muted); font-weight: 700; position: sticky; top: 0; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; }
tr.click:hover td { background: color-mix(in srgb, var(--turf) 6%, transparent); }
tr.sel td { background: color-mix(in srgb, var(--mark) 22%, transparent); }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }

/* ---- 試合カード */
.matches { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.mcard { display: flex; flex-direction: column; gap: 10px; }
.mcard .vs { font-weight: 700; font-size: 1.05rem; }
.mcard .date { font-family: var(--font-num); font-size: 1.1rem; font-weight: 600; color: var(--muted); }
.score { font-family: var(--font-num); font-weight: 700; font-size: 1.6rem; letter-spacing: .03em; }
.pill { display: inline-flex; align-items: center; min-height: 24px; padding: 0 9px; border-radius: 12px; font-size: .75rem; font-weight: 700; background: var(--surface-2); color: var(--muted); }
.pill.ok { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
.pill.warn { background: color-mix(in srgb, var(--opp) 16%, transparent); color: var(--opp); }
.pill.ai { background: color-mix(in srgb, var(--mark) 28%, transparent); color: var(--fg); }

/* ---- タグ付け画面 */
.tagging { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 14px; align-items: start; }
.player-box { background: #000; border-radius: var(--r); overflow: hidden; position: relative; }
.player-box video { width: 100%; display: block; max-height: clamp(220px, calc(100vh - 380px), 62vh); background: #000; }
.picker { aspect-ratio: 16 / 9; max-width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: #dfe7f1; text-align: center; padding: 20px;
  background: repeating-linear-gradient(90deg, #12457f 0 60px, #154d8c 60px 120px); }
.picker .btn { background: var(--mark); color: #142233; border-color: var(--mark); }
.scoreboard { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.scoreboard .btn.sm { padding: 0 10px; }
.timecode { font-family: var(--font-num); font-weight: 700; font-size: 1.5rem; margin-right: 4px; font-variant-numeric: tabular-nums; min-width: 9.5ch; }
.timeline { position: relative; height: 34px; background: var(--surface-2); border-radius: 8px; cursor: pointer; touch-action: none; border: 1px solid var(--line); overflow: hidden; }
.timeline .q { position: absolute; top: 0; bottom: 0; border-left: 1px dashed var(--line); }
.timeline .mk { position: absolute; top: 5px; width: 4px; height: 24px; border-radius: 2px; transform: translateX(-2px); background: var(--turf); }
.timeline .mk.opp { background: var(--opp); }
.timeline .mk.sel { outline: 2px solid var(--fg); top: 2px; height: 30px; }
.timeline .ph { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--bad); pointer-events: none; }
.events { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 6px; }
.evbtn { min-height: 56px; padding: 0 6px; line-height: 1.15; font-size: .92rem; border-radius: 10px; border: 0; background: var(--turf); color: var(--on-turf); font-weight: 700; font-size: 1rem; cursor: pointer; position: relative; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.evbtn:active { background: var(--turf-strong); transform: scale(.98); }
.evbtn.opp { background: var(--opp); }
.lv-stage { position: relative; }
.lv-stage video { width: 100%; display: block; max-height: clamp(220px, calc(100vh - 380px), 62vh); background: #000; }
.lv-ov { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; touch-action: none; cursor: crosshair; }
table.big { font-size: 1.15rem; }
table.big td.n { font-family: var(--font-num); font-size: 1.5rem; font-weight: 700; }
.evbtn:disabled { opacity: .35; cursor: default; }
.evbtn kbd { position: absolute; top: 2px; right: 5px; font-family: var(--font-num); font-size: .75rem; opacity: .7; }
.side { display: flex; flex-direction: column; gap: 14px; }
.roster { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 6px; }
.shirt { min-height: 62px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4px; touch-action: manipulation; }
.shirt .no { font-family: var(--font-num); font-weight: 700; font-size: 1.5rem; line-height: 1; }
.shirt .nm { font-size: .7rem; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.shirt.on { background: var(--turf); border-color: var(--turf); color: var(--on-turf); }
.shirt.on .nm { color: var(--on-turf); opacity: .85; }
.shirt.none .no { font-size: .9rem; font-family: var(--font-ui); }
.lasttag { border-left: 4px solid var(--mark); }
/* iOS では非表示の file 入力をプログラムから開けないことがあるため、透明な入力をボタンに重ねて直接タップさせる */
.filebtn { position: relative; overflow: hidden; }
.filebtn .filehit { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 100px; }
.vstatus { padding: 10px 12px; border-radius: 9px; background: var(--surface-2); font-size: .9rem; }
.vstatus.err { background: color-mix(in srgb, var(--bad) 14%, var(--surface)); color: var(--fg); border: 1px solid color-mix(in srgb, var(--bad) 40%, var(--line)); }
.flash { animation: flash .6s ease-out; }
@keyframes flash { from { background: color-mix(in srgb, var(--mark) 45%, var(--surface)); } to { background: var(--surface); } }

/* ---- 集計 */
.tabbar { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabbar button { border: 0; background: none; padding: 10px 14px; font-weight: 700; color: var(--muted); border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; min-height: var(--tap); }
.tabbar button.on { color: var(--turf); border-bottom-color: var(--turf); }

/* ---- ダイアログ・トースト */
dialog { border: 0; border-radius: 14px; padding: 0; width: min(620px, calc(100vw - 32px)); max-height: calc(100vh - 48px); background: var(--surface); color: var(--fg); box-shadow: 0 20px 60px rgba(0,0,0,.35); }
dialog::backdrop { background: rgba(10, 20, 35, .45); }
.dlg-h { padding: 16px 18px 0; }
.dlg-b { padding: 14px 18px; overflow: auto; max-height: calc(100vh - 200px); }
.dlg-f { padding: 12px 18px 16px; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; border-top: 1px solid var(--line); }
.waitbox { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 40; width: min(460px, calc(100vw - 32px));
  background: var(--surface); color: var(--fg); border: 2px solid var(--turf); border-radius: 14px; padding: 14px 16px; box-shadow: 0 10px 30px rgba(0,0,0,.25); display: flex; flex-direction: column; gap: 8px; }
.waitbox .wt { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.05rem; }
.spin { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--surface-2); border-top-color: var(--turf); animation: spin 1s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
#toast { position: fixed; left: 50%; top: calc(60px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 50; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; width: max-content; max-width: calc(100vw - 32px); }
#toast div { background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 22px; font-weight: 600; box-shadow: var(--shadow); }
.notice { border: 1px solid color-mix(in srgb, var(--mark) 60%, var(--line)); background: color-mix(in srgb, var(--mark) 12%, var(--surface)); border-radius: var(--r); padding: 12px 14px; }
.steps { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 4px; }

@media (max-width: 980px) {
  .tagging { grid-template-columns: minmax(0, 1fr); }
}
/* ライブ解析: 記録ボタンを映像の横に固定（iPad 縦向きでも横並び） */
@media (min-width: 700px) {
  .tagging.live-grid { grid-template-columns: minmax(0, 1fr) 290px; }
  .live-side { position: sticky; top: calc(60px + env(safe-area-inset-top, 0px)); max-height: calc(100vh - 70px); overflow-y: auto; }
}
.live-side .evbtn { min-height: 50px; font-size: .88rem; }
.lv-sum { cursor: pointer; font-weight: 700; min-height: 36px; display: flex; align-items: center; }
@media (max-width: 520px) {
  .timecode { font-size: 1.35rem; }
  .brand { font-size: 1.1rem; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<script>
"use strict";
/* =====================================================================
   Hockey AI Analyzer（iPad版）
   - データは iPad の IndexedDB にのみ保存（外部送信なし）
   - 動画は「ファイル」/写真から選択し、端末内で再生（アップロードなし）
   - tags.source: manual / ai, tags.status: confirmed / estimated / rejected
     （AI推定値と人が確認した確定値を区別。第2段階用）
   ===================================================================== */

const CATEGORIES = ["一般男子", "一般女子", "大学男子", "大学女子", "高校男子", "高校女子", "中学男子", "中学女子", "U-15", "U-12", "その他"];
const POSITIONS = ["GK", "DF", "MF", "FW", "未設定"];
const DEFAULT_EVENTS = [
  ["シュート", "ゴール,枠内(セーブ),枠外,ブロック"], ["PC", "ゴール,シュートあり,シュートなし"], ["PS", "ゴール,失敗"],
  ["サークル侵入", "シュートあり,シュートなし"], ["ボール奪取", ""], ["ボールロスト", ""], ["ファウル", ""], ["カード", "グリーン,イエロー,レッド"],
];
const GOAL_EVENTS = ["シュート", "PS"];
const ON_TARGET = ["ゴール", "枠内(セーブ)"];
const STATUS_LABEL = { confirmed: "確定", estimated: "AI推定(未確認)", rejected: "却下" };
const SOURCE_LABEL = { manual: "手入力", ai: "AI" };

/* ------------------------------------------------------------ 保存（IndexedDB） */
const STORES = ["teams", "players", "matches", "eventTypes", "tags", "videos", "aiTracks", "meta"];
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      let req;
      try { req = indexedDB.open("hockey-ai-analyzer", 2); } catch (e) { return rej(e); }
      req.onupgradeneeded = () => {
        const d = req.result;
        for (const s of STORES) {
          if (d.objectStoreNames.contains(s)) continue;
          const os = s === "videos" ? d.createObjectStore(s, { keyPath: "matchId" }) : s === "meta" ? d.createObjectStore(s, { keyPath: "id" }) : d.createObjectStore(s, { keyPath: "id", autoIncrement: true });
          if (s === "players") os.createIndex("teamId", "teamId");
          if (s === "tags" || s === "aiTracks") os.createIndex("matchId", "matchId");
        }
      };
      req.onsuccess = () => { this.db = req.result; res(); };
      req.onerror = () => rej(req.error);
    });
  },
  _tx(store, mode, fn) {
    return new Promise((res, rej) => {
      const tx = this.db.transaction(store, mode);
      let out;
      const r = fn(tx.objectStore(store));
      if (r) r.onsuccess = () => { out = r.result; };
      tx.oncomplete = () => res(out);
      tx.onerror = () => rej(tx.error);
      tx.onabort = () => rej(tx.error || new Error("保存が中断されました"));
    });
  },
  all(s) { return this._tx(s, "readonly", os => os.getAll()); },
  get(s, k) { return this._tx(s, "readonly", os => os.get(k)); },
  put(s, v) { return this._tx(s, "readwrite", os => os.put(v)); },
  del(s, k) { return this._tx(s, "readwrite", os => os.delete(k)); },
  bulk(ops) { // [[store, "put"|"delete"|"clear", value]]
    const names = [...new Set(ops.map(o => o[0]))];
    return new Promise((res, rej) => {
      if (!names.length) return res();
      const tx = this.db.transaction(names, "readwrite");
      for (const [s, op, v] of ops) { const os = tx.objectStore(s); op === "clear" ? os.clear() : op === "delete" ? os.delete(v) : os.put(v); }
      tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
    });
  },
};

/* メモリ上のキャッシュ（小規模データなので全件保持） */
const S = { teams: [], players: [], matches: [], eventTypes: [], tags: [], videoKeys: new Set() };
async function reload() {
  for (const s of ["teams", "players", "matches", "eventTypes", "tags"]) S[s] = await DB.all(s);

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else if (k in el && k !== "list" && typeof v !== "string") el[k] = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return el;
}
function fmt(sec) {
  if (sec == null || isNaN(sec)) return "";
  sec = Math.max(0, sec);
  const hh = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = Math.floor(sec % 60), t = Math.floor((sec % 1) * 10 + 1e-6);
  const mm = String(m).padStart(2, "0"), ss = String(s).padStart(2, "0");
  return (hh ? hh + ":" : "") + `${mm}:${ss}.${t}`;
}
function parseTime(txt) {
  txt = String(txt).trim();
  if (!txt) throw new Error("empty");
  let total = 0;
  for (const p of txt.split(":")) { const v = parseFloat(p); if (isNaN(v)) throw new Error("bad"); total = total * 60 + v; }
  return total;
}
function toast(msg) {
  const el = h("div", null, msg);
  document.getElementById("toast").append(el);
  setTimeout(() => el.remove(), 2600);
}
const prefs = {
  get(k, d) { try { const v = localStorage.getItem("hai." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("hai." + k, JSON.stringify(v)); } catch { } },
};

/* ダイアログ（confirm/prompt は使わない） */
function dialog(title, body, buttons) {
  const dlg = document.getElementById("dlg");
  return new Promise(resolve => {
    dlg.replaceChildren(
      h("div", { class: "dlg-h" }, h("h2", null, title)),
      h("div", { class: "dlg-b" }, body),
      h("div", { class: "dlg-f" }, buttons.map(b => h("button", {
        class: "btn " + (b.cls || ""), type: "button",
        onclick: async () => { if (b.check && !(await b.check())) return; resolve(b.value); dlg.close(); },
      }, b.label))),
    );
    dlg.onclose = () => resolve(dlg.returnValue === "" ? undefined : undefined);
    dlg.onclick = e => { if (e.target === dlg) { dlg.close(); } };
    dlg.showModal();
  });
}
async function confirmDlg(title, msg, okLabel = "削除する") {
  return (await dialog(title, h("p", null, msg), [{ label: "キャンセル", value: false }, { label: okLabel, cls: "danger", value: true }])) === true;
}
function field(label, input) { return h("label", { class: "field" }, label, input); }
function select(id, options, value) {
  return h("select", { id }, options.map(([v, t]) => h("option", { value: v, selected: String(v) === String(value) }, t)));
}
function table(cols, rows, opts = {}) {
  if (!rows.length) return h("div", { class: "tablewrap" }, h("div", { class: "empty" }, opts.empty || "データがありません"));
  return h("div", { class: "tablewrap", style: opts.maxH ? `max-height:${opts.maxH}` : null },
    h("table", null,
      h("thead", null, h("tr", null, cols.map(c => h("th", { class: c.n ? "n" : null }, c.t)))),
      h("tbody", null, rows.map((r, i) => {
        const tr = h("tr", { class: (opts.onRow ? "click " : "") + (opts.selected && opts.selected(r) ? "sel" : "") },
          cols.map(c => { const v = c.f ? c.f(r) : r[c.k]; return h("td", { class: c.n ? "n" : null }, v == null || (typeof v === "number" && isNaN(v)) ? "—" : v); }));
        if (opts.onRow) tr.addEventListener("click", () => opts.onRow(r, i));
        return tr;
      }))));
}

/* ------------------------------------------------------------ ファイル保存（共有シート優先） */
async function saveFile(name, text, mime) {
  const blob = new Blob([text], { type: mime });
  try {
    const file = new File([blob], name, { type: mime });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: name });
      return;
    }
  } catch (e) { if (e && e.name === "AbortError") return; }
  try {
    const a = h("a", { href: URL.createObjectURL(blob), download: name });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast(`${name} の保存を開始しました。保存されない場合は「コピー」をお使いください`);
  } catch { toast("保存できませんでした。「コピー」をお使いください"); }
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast("コピーしました"); }
  catch {
    const ta = h("textarea", { readOnly: true }, text);
    dialog("コピーしてください", ta, [{ label: "閉じる", value: true }]);
    setTimeout(() => { ta.focus(); ta.select(); }, 50);
  }
}
const csvCell = v => { if (v == null) return ""; const s = String(v); return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
const toCSV = (cols, rows) => "﻿" + [cols.map(c => csvCell(c.t)).join(","), ...rows.map(r => cols.map(c => csvCell(c.f ? c.f(r) : r[c.k])).join(","))].join("\r\n");

function tagRows(matchIds, confirmedOnly) {
  const ids = new Set(matchIds);
  return S.tags.filter(t => ids.has(t.matchId) && t.status !== "rejected" && (!confirmedOnly || t.status === "confirmed"))
    .map(t => {
      const m = match(t.matchId), p = player(t.playerId), tm = team(t.teamId);
      return { ...t, m, date: m?.date, opp: team(m?.oppId)?.name, category: m?.category, teamName: tm?.name ?? "（未設定）",
        number: p?.number, playerName: p?.name ?? "", playerLabel: p ? pLabel(p) : "（選手未設定）", matchLabel: m ? `${m.date} vs ${team(m.oppId)?.name}` : "?" };
    })
    .sort((a, b) => (a.date || "").localeCompare(b.date || "") || a.matchId - b.matchId || a.time - b.time);
}
function pivot(rows, keyFn, keyCols) {
  const evOrder = S.eventTypes.map(e => e.name);
  const evs = [...new Set(rows.map(r => r.eventType))].sort((a, b) => (evOrder.indexOf(a) + 1 || 999) - (evOrder.indexOf(b) + 1 || 999));
  const groups = new Map();
  for (const r of rows) {
    const k = keyFn(r);
    if (!groups.has(k.key)) groups.set(k.key, { ...k.vals, _n: {}, _goals: 0, _ont: 0, _matches: new Set() });
    const g = groups.get(k.key);
    g._n[r.eventType] = (g._n[r.eventType] || 0) + 1;
    if (GOAL_EVENTS.includes(r.eventType) && r.result === "ゴール") g._goals++;
    if (r.eventType === "シュート" && ON_TARGET.includes(r.result)) g._ont++;
    g._matches.add(r.matchId);
  }
  const out = [...groups.values()].map(g => {
    const o = { ...g };
    for (const e of evs) o[e] = g._n[e] || 0;
    o["得点"] = g._goals; o["枠内シュート"] = g._ont;
    o["決定率(%)"] = o["シュート"] ? Math.round(g._goals / o["シュート"] * 1000) / 10 : null;
    o["試合数"] = g._matches.size;
    return o;
  });
  const cols = [...keyCols, ...evs.map(e => ({ t: e, k: e, n: true })), { t: "得点", k: "得点", n: true }, { t: "枠内シュート", k: "枠内シュート", n: true }, { t: "シュート決定率(%)", k: "決定率(%)", n: true }];
  return { cols, rows: out };
}
const teamSummary = rows => pivot(rows, r => ({ key: r.teamName, vals: { team: r.teamName } }), [{ t: "チーム", k: "team" }]);
const matchSummary = rows => pivot(rows, r => ({ key: r.matchId + "|" + r.teamName, vals: { match: r.matchLabel, team: r.teamName } }), [{ t: "試合", k: "match" }, { t: "チーム", k: "team" }]);
function playerSummary(rows) {
  const p = pivot(rows.filter(r => r.playerId != null), r => ({ key: r.playerId, vals: { team: r.teamName, player: r.playerLabel, _no: r.number ?? 999 } }),
    [{ t: "チーム", k: "team" }, { t: "選手", k: "player" }, { t: "出場試合(タグあり)", k: "試合数", n: true }]);
  p.rows.sort((a, b) => a.team.localeCompare(b.team, "ja") || a._no - b._no);
  return p;
}
function quarterSummary(rows) {
  const qs = ["Q1", "Q2", "Q3", "Q4", "Q?"];
  const map = new Map();
  for (const r of rows) {
    const k = r.teamName + "|" + r.eventType;
    if (!map.has(k)) map.set(k, { team: r.teamName, ev: r.eventType, Q1: 0, Q2: 0, Q3: 0, Q4: 0, "Q?": 0 });
    map.get(k)[r.quarter ? "Q" + r.quarter : "Q?"]++;
  }
  const used = qs.filter(q => [...map.values()].some(v => v[q]));
  return { cols: [{ t: "チーム", k: "team" }, { t: "イベント", k: "ev" }, ...used.map(q => ({ t: q, k: q, n: true }))], rows: [...map.values()] };
}
const TAG_COLS = [
  { t: "タグID", k: "id" }, { t: "試合日", k: "date" }, { t: "対戦相手", k: "opp" }, { t: "カテゴリー", k: "category" },
  { t: "動画時刻", f: r => fmt(r.time) }, { t: "動画秒", f: r => r.time.toFixed(2) }, { t: "Q", k: "quarter" }, { t: "イベント", k: "eventType" },
  { t: "結果", f: r => r.result || "" }, { t: "チーム", k: "teamName" }, { t: "背番号", k: "number" }, { t: "選手", k: "playerName" },
  { t: "メモ", f: r => r.memo || "" }, { t: "入力元", f: r => SOURCE_LABEL[r.source] }, { t: "状態", f: r => STATUS_LABEL[r.status] },
];
function anonymize(cols) {
  return cols.map(c => {
    if (c.t === "選手" && c.k === "playerName") return { ...c, f: r => r.playerName ? "***" : "" };
    if (c.t === "選手" && c.k === "player") return { ...c, f: r => (r.player.match(/^#\d+/) || ["***"])[0] };
    if (c.t === "氏名") return { ...c, f: () => "***" };
    return c;
  });
}

        h("li", null, "Safari の他のタブを閉じてから、もう一度お試しください。"),
        h("li", null, "ホーム画面に追加した版（GitHub Pages 版）の方が使えるメモリに余裕があります。"),

      h("pre", { class: "small", style: "white-space:pre-wrap;margin:0;font-family:ui-monospace,Menlo,monospace" }, pk.log || ""),
      h("div", null, h("button", { class: "btn sm", onclick: () => copyText(`段階=${pk.stage}\n` + (pk.log || "")) }, "この記録をコピー")),
      h("div", null, h("button", { class: "btn sm", onclick: e => e.target.closest(".notice").remove() }, "閉じる"))));
  }

  wrap.append(h("div", { class: "row" },
    h("label", { class: "field grow" }, "試合", select("t_match", ms.map(x => [x.id, mLabel(x)]), m.id)),

    ctrl("1コマ ▶", () => { video.pause(); seek(video.currentTime + 1 / fps); }),

  function drawTL() {

      const mk = h("div", { class: "mk" + (t.teamId !== m.teamId ? " opp" : "") + (state.selTag === t.id ? " sel" : ""), title: `${fmt(t.time)} ${t.eventType} ${pLabel(player(t.playerId))}` });

  tl.addEventListener("pointerdown", e => { tlSeek(e); tl.setPointerCapture(e.pointerId); });
  tl.addEventListener("pointermove", e => { if (e.buttons) tlSeek(e); });

  /* --- イベントボタン */
  const evNames = S.eventTypes.filter(e => e.active !== false).map(e => e.name);
  left.append(h("div", { class: "events" }, evNames.map((name, i) => h("button", {
    class: "evbtn", disabled: !video, onclick: () => addTag(name),
  }, name, i < 9 ? h("kbd", null, i + 1) : null))));

  async function addTag(eventType, time) {
    if (!video && time == null) return;
    const t = { matchId: m.id, time: Math.round((time ?? video.currentTime) * 100) / 100, quarter: tagCtx.quarter, eventType,

        h("div", { class: "row spread" }, h("span", { class: "label" }, "直前のタグ"), h("span", { class: "num", style: "font-size:1.15rem;font-weight:700" }, fmt(last.time))),
        h("div", { style: "font-weight:700" }, `${last.eventType} ・ ${team(last.teamId)?.name ?? ""} ・ ${player(last.playerId) ? pLabel(player(last.playerId)) : "選手なし"}`),

        h("div", { class: "row" },
          h("button", { class: "btn sm danger", onclick: async () => { await DB.del("tags", last.id); tagCtx.lastTagId = null; S.tags = await DB.all("tags"); toast("取り消しました"); drawTL(); drawSide(); drawList(); } }, "取り消し"),
          h("button", { class: "btn sm", onclick: () => { tagCtx.lastTagId = null; drawSide(); } }, "完了"))) : null,
      h("div", { class: "panel stack small" },
        h("span", { class: "label" }, "再生設定"),
        h("label", { class: "field" }, "タグへ移動するとき何秒前から再生するか",
          select("t_lead", [[0, "0秒"], [2, "2秒"], [3, "3秒"], [5, "5秒"], [8, "8秒"], [10, "10秒"]], state.lead)),
        h("label", { class: "check" }, h("input", { type: "checkbox", id: "t_auto", checked: state.autoplay }), "移動後に自動再生"),
        video ? fileButton("別の動画を選ぶ", "image/*,video/*", "sm", f => useVideoFile(m, f), "t_video2") : null,
        video ? h("button", { class: "btn sm danger", onclick: async () => {
          if (!(await confirmDlg("動画を外す", "この試合から動画を外します。付けたタグは消えません。写真アプリの動画も消えません。", "外す"))) return;
          dropVideoURL(m.id); pendingFiles.delete(m.id);
          const ops = [["matches", "put", { ...m, videoName: null, videoSize: null, duration: null, updatedAt: now() }]];
          if (S.videoKeys.has(m.id)) ops.push(["videos", "delete", m.id]);
          await DB.bulk(ops); await reload(); toast("動画を外しました"); render();
        } }, "この試合から動画を外す") : null,
        S.videoKeys.has(m.id)
          ? h("button", { class: "btn sm", onclick: async () => { await DB.del("videos", m.id); S.videoKeys.delete(m.id); toast("iPad内の動画を削除しました（タグは残ります）"); drawSide(); } }, "iPad内に保存した動画を削除")
          : video ? h("button", { class: "btn sm", onclick: () => storeVideo(m) }, "この動画を iPad 内に保存（次回選択不要）") : null),
    );
    side.querySelector("#t_lead").addEventListener("change", e => { state.lead = +e.target.value; prefs.set("lead", state.lead); });
    side.querySelector("#t_auto").addEventListener("change", e => { state.autoplay = e.target.checked; prefs.set("autoplay", state.autoplay); });
  }

  wrap.append(listBox);

    const rows = matchTags();
    listBox.replaceChildren(
      h("div", { class: "row spread" }, h("h3", null, `タグ一覧（${rows.length}件）`),
        h("button", { class: "btn sm", onclick: () => editTag(null) }, "＋ 時刻を指定して追加")),

    if (!(await confirmDlg("バックアップから復元", `${data.exportedAt?.slice(0, 16).replace("T", " ")} のバックアップ（試合 ${(data.matches || []).length}・タグ ${n}）で置き換えます。`, "復元する"))) return;
    const ops = [];
    for (const s of ["teams", "players", "matches", "eventTypes", "tags", "aiTracks"]) { ops.push([s, "clear"]); for (const v of data[s] || []) ops.push([s, "put", v]); }
    await DB.bulk(ops); await reload(); toast("復元しました"); location.hash = "#home"; render();
  }
}

/* ------------------------------------------------------------ 画面: イベント設定 */
views.events = async () => {
  const wrap = h("div", { class: "stack" }, h("h2", null, "イベント設定"),
    h("p", { class: "small muted", style: "margin:0" }, "タグ付け画面のボタンです。上から順に表示され、先頭 9 個は外付けキーボードの 1〜9 でも入力できます。名前を変えても既存タグのイベント名は変わりません。"));
  const list = S.eventTypes;
  const move = async (i, d) => {
    const a = list[i], b = list[i + d]; if (!b) return;
    await DB.bulk([["eventTypes", "put", { ...a, order: b.order }], ["eventTypes", "put", { ...b, order: a.order }]]); await reload(); render();
  };
  wrap.append(table([
    { t: "順", f: (e) => h("div", { class: "row" }, h("button", { class: "btn sm", onclick: ev => { ev.stopPropagation(); move(list.indexOf(e), -1); } }, "↑"), h("button", { class: "btn sm", onclick: ev => { ev.stopPropagation(); move(list.indexOf(e), 1); } }, "↓")) },
    { t: "イベント名", k: "name" }, { t: "結果の選択肢", f: e => e.results || "—" }, { t: "使用", f: e => e.active === false ? "停止中" : "○" },
  ], list, { onRow: e => eventDialog(e) }));
  wrap.append(h("div", null, h("button", { class: "btn primary", onclick: () => eventDialog() }, "＋ イベントを追加")));
  return wrap;
};
function eventDialog(e) {
  e = e || {};
  const body = h("div", { class: "grid-form" },
    field("イベント名 *", h("input", { type: "text", id: "ev_name", value: e.name || "" })),
    field("結果の選択肢（カンマ区切り）", h("input", { type: "text", id: "ev_res", value: e.results || "", placeholder: "成功,失敗" })),
    h("label", { class: "check" }, h("input", { type: "checkbox", id: "ev_act", checked: e.active !== false }), "ボタンを表示する"));
  dialog(e.id ? "イベントの編集" : "イベントを追加", body, [
    e.id ? { label: "削除", cls: "danger", value: "del", check: async () => { await DB.del("eventTypes", e.id); await reload(); render(); return true; } } : null,
    { label: "キャンセル", value: false },
    { label: "保存", cls: "primary", value: true, check: async () => {
      const name = document.getElementById("ev_name").value.trim();
      if (!name) { toast("イベント名を入力してください"); return false; }
      if (S.eventTypes.some(x => x.name === name && x.id !== e.id)) { toast("同じ名前のイベントがあります"); return false; }
      await DB.put("eventTypes", { ...e, name, results: document.getElementById("ev_res").value.replace(/、/g, ",").split(",").map(s => s.trim()).filter(Boolean).join(","),
        active: document.getElementById("ev_act").checked, order: e.order ?? (Math.max(0, ...S.eventTypes.map(x => x.order)) + 10) });
      await reload(); render(); return true;
    } }].filter(Boolean));
}

/* ------------------------------------------------------------ 初期データ・サンプル */
async function seedEvents() {
  if ((await DB.all("eventTypes")).length) return;
  await DB.bulk(DEFAULT_EVENTS.map(([name, results], i) => ["eventTypes", "put", { name, results, order: (i + 1) * 10, active: true }]));
}
async function loadSample() {
  const own = await DB.put("teams", { name: "（例）桜ホッケークラブ", own: true, color: "#1b5aa6", memo: "サンプル", createdAt: now() });
  const opp = await DB.put("teams", { name: "（例）青葉HC", own: false, color: "#d0612a", memo: "サンプル", createdAt: now() });
  const ps = [[1, "高橋 大輝", "GK"], [3, "鈴木 翔", "DF"], [5, "伊藤 蓮", "DF"], [7, "佐藤 健", "MF"], [8, "中村 陽", "MF"], [10, "山田 太郎", "FW"], [11, "小林 湊", "FW"]];
  await DB.bulk([...ps.map(([n, name, pos]) => ["players", "put", { teamId: own, number: n, name, position: pos, active: true, memo: "", createdAt: now() }]),
    ["players", "put", { teamId: opp, number: 9, name: "田中 一郎", position: "FW", active: true, memo: "", createdAt: now() }]]);
  const today = new Date().toISOString().slice(0, 10);
  const mid = await DB.put("matches", { date: today, kickoff: "10:00", category: "高校男子", teamId: own, oppId: opp, competition: "（例）練習試合", venue: "", scoreOwn: 2, scoreOpp: 1, memo: "サンプル", createdAt: now() });
  await reload();
  const pid = n => S.players.find(p => p.teamId === own && p.number === n)?.id;
  const T = (time, q, ev, tm, pl, res) => ["tags", "put", { matchId: mid, time, quarter: q, eventType: ev, teamId: tm, playerId: pl, result: res || null, memo: "", source: "manual", status: "confirmed", createdAt: now(), updatedAt: now() }];
  await DB.bulk([T(95, 1, "サークル侵入", own, pid(10), "シュートあり"), T(97, 1, "シュート", own, pid(10), "ゴール"), T(240, 1, "ボール奪取", own, pid(7)),
    T(410, 2, "PC", opp, S.players.find(p => p.teamId === opp)?.id, "シュートあり"), T(612, 2, "シュート", own, pid(11), "枠外"), T(790, 3, "ボール奪取", own, pid(3)),
    T(905, 3, "シュート", own, pid(8), "ゴール"), T(1100, 4, "ボールロスト", own, pid(7))]);
  setMatch(mid); await reload(); toast("サンプルデータを追加しました"); render();
}

/* ------------------------------------------------------------ AI（第2段階の接続口） */
/* AI 推定結果は必ず source:"ai", status:"estimated" で保存し、コーチが確認して confirmed にする。
   iPad 上での推論（WebGPU + ONNX Runtime Web）またはクラウドGPU（選手名は送らず、動画フレームのみ）を想定。 */
const HockeyAI = {
  capabilities() { return { webgpu: !!navigator.gpu, wasm: typeof WebAssembly === "object" }; },
  async importEstimatedTags(matchId, items) { // items: [{time, eventType, teamId, playerId, conf}]
    await DB.bulk(items.map(it => ["tags", "put", { matchId, time: it.time, eventType: it.eventType, teamId: it.teamId ?? null, playerId: it.playerId ?? null,
      quarter: it.quarter ?? null, result: null, memo: it.conf != null ? `AI信頼度 ${Math.round(it.conf * 100)}%` : "", source: "ai", status: "estimated", createdAt: now(), updatedAt: now() }]));
    await reload();
  },
};
window.HockeyAI = HockeyAI;

/* ------------------------------------------------------------ ルーター */
async function render() {
  const r = (location.hash || "#home").slice(1);
  state.route = views[r] ? r : "home";
  document.querySelectorAll("#tabs a").forEach(a => a.classList.toggle("on", a.dataset.r === state.route));
  const view = document.getElementById("view");
  try {
    try { window.__viewCleanup?.(); } catch { }
    window.__viewCleanup = null;
    for (const v of view.querySelectorAll("video")) { try { v.pause(); if (!v.srcObject) { v.removeAttribute("src"); v.load(); } } catch { } }
    const el = await views[state.route]();
    view.replaceChildren(el);
  } catch (e) {
    console.error(e);
    view.replaceChildren(h("div", { class: "panel" }, h("h3", null, "表示できませんでした"), h("p", { class: "small" }, String(e && e.message || e))));
  }
}
let lastRoute = null;
window.addEventListener("hashchange", () => { const r = (location.hash || "#home").slice(1); if (r !== lastRoute) { lastRoute = r; window.scrollTo(0, 0); render(); } });

(async function start() {
  try {
    await DB.open();
    await seedEvents();
    await reload();
    try { if (navigator.storage?.persist && !(await navigator.storage.persisted())) navigator.storage.persist(); } catch { }
  } catch (e) {
    document.getElementById("view").replaceChildren(h("div", { class: "panel stack" }, h("h3", null, "データを保存できない状態です"),
      h("p", null, "プライベートブラウズを使っている場合は通常のタブで開いてください。Safari の設定で「すべての Cookie をブロック」がオンだと保存できません。"),
      h("p", { class: "small muted" }, String(e && e.message || e))));
    return;
  }
  try { DIAG = JSON.parse(localStorage.getItem("hai.diag") || "[]"); } catch { DIAG = []; }
  try { const rec = await DB.get("meta", "diag"); if (rec && rec.entries && (!DIAG.length || rec.entries[rec.entries.length - 1].t > DIAG[DIAG.length - 1].t)) DIAG = rec.entries; } catch { }
  // 前回の起動以降に「選択画面を開いた」が記録され、その後に完了・キャンセル・エラーが無い → 途中で落ちた
  const lastStart = DIAG.map(e => e.ev).lastIndexOf("start");
  const session = DIAG.slice(lastStart + 1);
  const openIdx = session.map(e => e.ev).lastIndexOf("open");
  if (openIdx >= 0 && Date.now() - session[openIdx].t < 30 * 60 * 1000 && !session.slice(openIdx).some(e => ["meta", "cancel", "error", "empty"].includes(e.ev))) {
    const tail = session.slice(openIdx);
    const file = tail.find(e => e.ev === "file");
    state.reloadWarn = { stage: file ? (tail.some(e => e.ev === "player") ? "player" : "received") : "open", name: file?.name, size: file?.size, type: file?.type, log: diagText(session) };
    if (match(session[openIdx].matchId)) setMatch(session[openIdx].matchId);
    try { history.replaceState(null, "", "#tag"); } catch { location.hash = "#tag"; }
  }
  diag("start", { ua: (navigator.userAgent.match(/OS [\d_]+/) || [""])[0].replace(/_/g, ".") });
  lastRoute = (location.hash || "#home").slice(1);
  render();
})();
